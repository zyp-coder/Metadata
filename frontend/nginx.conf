# MetaData002 前端 Nginx 配置（生产环境）
# 用途：serve 前端静态文件 + 反向代理 /api 到后端
# 挂载路径：/usr/share/nginx/html（前端 build 产物）
server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API 反向代理到后端
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # 后端主动刷新接口可能长连接
        proxy_buffering off;
    }

    # Admin 静态文件（Django 后台）
    location /static/admin/ {
        alias /usr/share/nginx/static/admin/;
    }

    # DRF 可浏览 API 的静态文件
    location /static/rest_framework/ {
        alias /usr/share/nginx/static/rest_framework/;
    }

    # SPA fallback：所有非文件、非 API 的请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 前端静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}